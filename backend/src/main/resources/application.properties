# Spring Boot Application Properties
# This file provides defaults for local development
# For production, set these as environment variables in Cloud Run

# ============================================================================
# DATABASE CONFIGURATION (CockroachDB)
# ============================================================================
# For local: Set COCKROACH_DB_URL in .env file or environment
# For Cloud Run: Set as environment variable in service configuration
spring.datasource.url=${COCKROACH_DB_URL:}
spring.datasource.username=${COCKROACH_DB_USERNAME:}
spring.datasource.password=${COCKROACH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# FIREBASE CONFIGURATION
# ============================================================================
# For local: Set GOOGLE_APPLICATION_CREDENTIALS to path of your JSON file
#            Example: C:/path/to/firebase-service-account.json
# For Cloud Run: Automatically provided by Google Cloud
firebase.project-id=${FIREBASE_PROJECT_ID:escritores-nogueira}

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================================================
# SPRING PROFILE
# ============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.CockroachDialect
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration (Mailgun)
app.email.from=${APP_EMAIL_FROM:no-reply@escritoresnogueira.com}
app.newsletter.from=${APP_NEWSLETTER_FROM:newsletter@escritoresnogueira.com}
mailgun.api-key=${MAILGUN_API_KEY:}
mailgun.domain=${MAILGUN_DOMAIN:}

# Stripe Configuration
stripe.api-key=${STRIPE_API_KEY:test-key}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:test-secret}
stripe.currency=${STRIPE_CURRENCY:BRL}

# reCAPTCHA Configuration
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:test-secret}
recaptcha.site-key=${RECAPTCHA_SITE_KEY:test-site}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Session Configuration
session.expiration-hours=${SESSION_EXPIRATION_HOURS:24}
session.max-sessions-per-user=${SESSION_MAX_PER_USER:5}

# Logging
logging.level.root=INFO
logging.level.com.escritoresnogueira.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
