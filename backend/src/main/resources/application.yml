spring:
  application:
    name: escritores-nogueira-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}


  # CockroachDB Configuration
  datasource:
    url: ${COCKROACH_DB_URL}
    username: ${COCKROACH_DB_USERNAME}
    password: ${COCKROACH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:4}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:120000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      # CockroachDB specific settings
      data-source-properties:
        reWriteBatchedInserts: true
        ApplicationName: escritores-nogueira
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.CockroachDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Email (SMTP) configuration example - set real values via environment variables in production
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  


# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    # Application logging
    com.escritoresnogueira: ${LOG_LEVEL_APP:INFO}
    main.java.com.escritoresnogueira: ${LOG_LEVEL_APP:INFO}
    # Security debugging
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.security.web.FilterChainProxy: ${LOG_LEVEL_SECURITY_TRACE:WARN}
    # Web/MVC debugging
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.web.servlet.mvc.method.annotation: ${LOG_LEVEL_WEB_METHOD:INFO}
    # Hibernate SQL (reduce in production)
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/application.log}
    max-size: 10MB
    max-history: 10

# Server Configuration
server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:20}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}
  servlet:
    # Centraliza todas as APIs sob / por padrão. Pode ser sobrescrito com a var de ambiente SERVER_CONTEXT_PATH
    context-path: ${SERVER_CONTEXT_PATH:/}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}
    include-stacktrace: on_param

# Firebase Configuration
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  # Web SDK config (public - safe to expose to frontend)
  web:
    api-key: ${FIREBASE_WEB_API_KEY}
    auth-domain: ${FIREBASE_AUTH_DOMAIN}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
    messaging-sender-id: ${FIREBASE_MESSAGING_SENDER_ID:}
    app-id: ${FIREBASE_APP_ID}

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:test-key}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  # If `STRIPE_ALLOWED_METHODS` is not set, the server will leave
  # `payment_method_types` unset when creating Checkout Sessions so
  # Stripe Checkout shows all payment methods enabled in your
  # Stripe Dashboard for the currency/region.
  allowed-methods: ${STRIPE_ALLOWED_METHODS:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:test-secret}
  currency: ${STRIPE_CURRENCY:BRL}

# Session Configuration
session:
  expiration-hours: ${SESSION_EXPIRATION_HOURS:24}
  max-sessions-per-user: ${SESSION_MAX_PER_USER:5}

# reCAPTCHA Configuration
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:test-secret}
  site-key: ${RECAPTCHA_SITE_KEY:test-site}
  verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}

# API Configuration
api:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  # Application settings
  app:
    # API key used to protect admin endpoints. Configure via environment variable APP_API_KEY in production.
    api-key: ${APP_API_KEY:}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS_INCLUDE:health,info}
      base-path: ${ACTUATOR_BASE_PATH:/actuator}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
      show-components: ${ACTUATOR_HEALTH_SHOW_COMPONENTS:when_authorized}
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true


# From address used by the EmailService
app:
  email:
    from: ${APP_EMAIL_FROM:}
  newsletter:
    from: ${APP_NEWSLETTER_FROM:}

# Mailgun Configuration
mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.escritoresnogueira: INFO
    main.java.com.escritoresnogueira: INFO
    org.springframework.security: WARN
    org.springframework.security.web.FilterChainProxy: WARN
    org.springframework.web: WARN
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

