steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/${_IMAGE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push the image with the specific commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGISTRY}/${_IMAGE}:${SHORT_SHA}']

  # 3. Push the image with the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGISTRY}/${_IMAGE}:latest']

  # 4. Deploy the new image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backendservice-escritoresnogueira'
      - '--image'
      - '${_REGISTRY}/${_IMAGE}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--set-secrets'
      - 'FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:1'
      - '--set-secrets'
      - '/secrets/.env=ENV:latest'
      - '--allow-unauthenticated'
      - '--quiet'

# User-defined substitutions
substitutions:
  _IMAGE: "escritoresnogueira-backend"
  _REGION: "europe-west1"
  _REGISTRY: "europe-west1-docker.pkg.dev/escritores-nogueira/cloud-run-source-deploy/escritoresnogueira"

# Build-level options
options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"