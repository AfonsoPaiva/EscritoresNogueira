steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - build
    - -t
    - gcr.io/${_TARGET_PROJECT}/${_IMAGE}:${SHORT_SHA}
    - -f
    - backend/Dockerfile
    - backend
- name: 'gcr.io/cloud-builders/docker'
  args:
    - push
    - gcr.io/${_TARGET_PROJECT}/${_IMAGE}:${SHORT_SHA}
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: bash
  args:
    - -c
    - |
      gcloud run deploy ${_SERVICE} \
        --image gcr.io/${_TARGET_PROJECT}/${_IMAGE}:${SHORT_SHA} \
        --region ${_REGION} \
        --platform managed \
        --project ${_TARGET_PROJECT} \
        --allow-unauthenticated \
        --update-secrets /app/.env=ENV:latest,FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest

images:
- gcr.io/${_TARGET_PROJECT}/${_IMAGE}:${SHORT_SHA}

substitutions:
  _IMAGE: "escritores-backend"
  _SERVICE: "escritores-backend"
  _REGION: "europe-west1"
  _TARGET_PROJECT: "escritores-nogueira"

timeout: "1200s"