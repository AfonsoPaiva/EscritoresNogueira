steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/${_IMAGE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push the image with the specific commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGISTRY}/${_IMAGE}:${SHORT_SHA}']

  # 3. Push the image with the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGISTRY}/${_IMAGE}:latest']

      
# User-defined substitutions
substitutions:
  _IMAGE: "escritoresnogueira-backend"
  _REGION: "europe-southwest1"
  _REGISTRY: "europe-southwest1-docker.pkg.dev/escritores-nogueira/cloud-run-source-deploy/escritoresnogueira"

# Build-level options
options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"