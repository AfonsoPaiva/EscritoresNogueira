steps:
- name: 'maven:3.9.6-openjdk-21'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    cd backend
    chmod +x mvnw
    ./mvnw clean package -DskipTests
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--tag=gcr.io/$PROJECT_ID/escritores-backend:$COMMIT_SHA'
  - '--tag=gcr.io/$PROJECT_ID/escritores-backend:latest'
  - './backend'
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'escritores-backend'
  - '--image=gcr.io/$PROJECT_ID/escritores-backend:latest'
  - '--region=europe-southwest1'
  - '--allow-unauthenticated'
  - '--platform=managed'
  - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod'
  # Adicione outras env vars aqui

options:
  logging: CLOUD_LOGGING_ONLY